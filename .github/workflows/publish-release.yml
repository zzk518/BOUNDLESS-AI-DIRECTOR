name: Publish release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release tag without the leading v
        required: true
        default: 1.1.1

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v4
        with:
          ref: v${{ inputs.version }}

      - name: Build the shareable ZIP
        run: >-
          zip -r JK-AI-Director-v${{ inputs.version }}.zip
          README.md VERSION install.ps1 skills tests .gitignore

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create v${{ inputs.version }} JK-AI-Director-v${{ inputs.version }}.zip
          --repo "$GITHUB_REPOSITORY"
          --title "JK AI Director v${{ inputs.version }}"
          --notes "Text-only screenwriting and directing skills with locked-screenplay delivery, cinematic frame grammar, storyboard, continuity, visual assets, and image/video prompt contracts."
