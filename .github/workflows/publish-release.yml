name: Publish release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v4
        with:
          ref: v1.0.0

      - name: Build the shareable ZIP
        run: >-
          zip -r JK-AI-Director-v1.0.0.zip
          README.md VERSION install.ps1 skills tests .gitignore

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create v1.0.0 JK-AI-Director-v1.0.0.zip
          --repo "$GITHUB_REPOSITORY"
          --title "JK AI Director v1.0.0"
          --notes "Initial public release: two text-only AI skills for screenwriting and directing, with installation and contract tests."
